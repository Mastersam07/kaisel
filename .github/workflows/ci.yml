name: Test

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

# Cancel superseded runs on the same ref so pushes don't pile up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test kaisel_core
        working-directory: packages/kaisel_core
        run: dart test --coverage=coverage

      - name: Format kaisel_core coverage
        working-directory: packages/kaisel_core
        run: |
          dart pub global activate coverage
          dart pub global run coverage:format_coverage \
            --lcov --in=coverage --out=coverage/lcov.info \
            --report-on=lib --check-ignore

      - name: Generate test optimizer
        working-directory: packages/kaisel
        run: dart run tool/test_optimizer.dart

      - name: Test kaisel with coverage
        working-directory: packages/kaisel
        run: flutter test --no-pub --coverage test/.test_optimizer.dart

      - name: Upload kaisel_core coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Mastersam07/gate
          files: packages/kaisel_core/coverage/lcov.info
          flags: kaisel_core
          fail_ci_if_error: false

      - name: Upload kaisel coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Mastersam07/gate
          files: packages/kaisel/coverage/lcov.info
          flags: kaisel
          fail_ci_if_error: false
