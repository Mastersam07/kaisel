<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#0E7490" stop-opacity="0.50"/>
      <stop offset="55%" stop-color="#0B2A3C" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#060A14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wingGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E7490"/>
      <stop offset="55%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#A5F3FC"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#155E75"/>
      <stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <g id="mark">
      <!-- right wing: bat membrane with wrist, thumb-claw, and three fingers -->
      <path id="wing" fill="url(#wingGrad)" d="
        M 548 560
        C 620 498, 692 444, 766 398
        C 790 380, 815 362, 842 348
        C 868 336, 894 326, 922 318
        C 908 386, 884 462, 846 538
        C 818 494, 776 506, 738 586
        C 708 540, 664 554, 622 628
        C 600 588, 576 582, 552 622
        Z"/>
      <path id="claw" fill="url(#wingGrad)" d="
        M 782 392
        C 796 362, 814 344, 838 332
        C 818 356, 806 376, 800 400
        Z"/>
      <use href="#wing" transform="translate(1024,0) scale(-1,1)"/>
      <use href="#claw" transform="translate(1024,0) scale(-1,1)"/>
      <!-- shadow-dissolve wisps, curved -->
      <g id="frags" fill="url(#wingGrad)">
        <path d="M 824 324 C 838 310, 852 302, 868 298 C 854 312, 844 324, 838 340 Z" opacity="0.65"/>
        <path d="M 884 254 C 896 242, 908 236, 922 233 C 910 244, 901 254, 895 266 Z" opacity="0.45"/>
      </g>
      <use href="#frags" transform="translate(1024,0) scale(-1,1)"/>
      <!-- sinuous neck and chest -->
      <path fill="url(#bodyGrad)" d="
        M 468 762
        C 452 640, 478 545, 528 468
        C 552 430, 566 376, 558 306
        C 576 300, 596 306, 612 324
        C 620 392, 602 448, 570 502
        C 528 574, 516 664, 538 762
        C 514 780, 492 780, 468 762
        Z"/>
      <!-- reptilian head with open jaw -->
      <path fill="url(#bodyGrad)" d="
        M 554 310
        C 558 274, 574 250, 600 238
        C 646 224, 686 230, 722 250
        C 692 264, 664 272, 638 278
        C 666 290, 684 304, 694 324
        C 662 330, 632 330, 612 326
        C 594 334, 572 330, 554 310
        Z"/>
      <!-- swept-back horn -->
      <path fill="url(#bodyGrad)" d="M 574 266 C 528 222, 490 194, 448 176 C 492 220, 528 258, 558 300 Z"/>
      <!-- eye -->
      <path fill="#E0FEFF" d="M 612 262 C 620 254, 632 254, 640 262 C 632 269, 619 269, 612 262 Z"/>
      <!-- long serpentine tail with barb -->
      <path fill="url(#bodyGrad)" d="
        M 498 744
        C 438 828, 352 872, 262 856
        C 208 846, 168 812, 158 770
        C 150 742, 156 718, 172 700
        C 168 726, 176 748, 196 768
        C 246 806, 330 800, 398 756
        C 436 732, 470 706, 498 676
        Z"/>
      <path fill="url(#bodyGrad)" d="M 168 706 C 150 688, 140 668, 138 645 C 154 664, 166 682, 178 698 Z"/>
    </g>
  </defs>
  <rect width="1024" height="1024" fill="#060A14"/>
  <rect width="1024" height="1024" fill="url(#bgGlow)"/>
  <use href="#mark" filter="url(#glow)" opacity="0.55"/>
  <use href="#mark"/>
</svg>
