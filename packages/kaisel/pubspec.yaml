name: kaisel
description: A Dart 3-native Flutter router built on sealed routes, pattern matching, and a stack-as-state model. No string paths, no codegen.
version: 1.1.0
repository: https://github.com/Mastersam07/kaisel
homepage: https://kaisel.dev
issue_tracker: https://github.com/Mastersam07/kaisel/issues
documentation: https://kaisel.dev
topics:
  - router
  - navigation
  - routing
  - deep-linking
  - go-router

screenshots:
  - description: The kaisel mark
    path: assets/brand/kaisel-icon.webp

resolution: workspace

environment:
  sdk: ^3.10.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.15.0
  kaisel_core: ^1.1.0
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
