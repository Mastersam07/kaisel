# kaisel_core is pure Dart, so it uses the Dart team's `lints` rather than
# flutter_lints. The strict-language block and shared rule set come from the
# workspace root.
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - require_trailing_commas
    - public_member_api_docs
