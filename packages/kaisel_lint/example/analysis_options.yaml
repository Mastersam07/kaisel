include: package:flutter_lints/flutter.yaml

# Enable the kaisel_lint plugin and turn on all of its rules, including the
# off-by-default adaptive one (so the example files demonstrate them firing).
plugins:
  kaisel_lint:
    path: ../
    diagnostics:
      avoid_modal_route_on_main_stack: true
      require_route_props: true
      prefer_push_or_replace_top_in_adaptive: true
      prefer_const_route_constructors: true
      prefer_pattern_match_over_is_check: true
      unused_guard_redirect: true
